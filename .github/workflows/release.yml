name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore MacroTool/MacroTool.csproj

    - name: Build and Publish
      run: |
        dotnet publish MacroTool/MacroTool.csproj -c Release -o ./publish

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/MacroTool.exe
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release v{0}', github.run_number) }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
